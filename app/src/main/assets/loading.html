<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ChefBolsillo — Cargando</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #FFF8ED;
          --ink: #2B2B2B;
          --accent: #FF6B4A;
          --yellow: #FFC145;
          --green: #4CAF7D;
          box-sizing: border-box;
          padding-top: env(safe-area-inset-top, 0px);
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme="light"]) { --bg: #201C16; --ink: #F5F0E6; }
        }
        :root[data-theme="dark"] { --bg: #201C16; --ink: #F5F0E6; }
        html { height: 100%; }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          height: 100%;
          min-height: 100vh;
          background: var(--bg);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Nunito', system-ui, sans-serif;
        }

        .wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 22px;
        }

        .ring-stage {
          position: relative;
          width: 148px;
          height: 148px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 6px solid rgba(43,43,43,0.08);
        }
        .ring::before {
          content: "";
          position: absolute;
          inset: -6px;
          border-radius: 50%;
          border: 6px solid transparent;
          border-top-color: var(--accent);
          border-right-color: var(--yellow);
          animation: spin 1.15s cubic-bezier(.5,0,.5,1) infinite;
        }

        .plate {
          position: relative;
          width: 78px;
          height: 78px;
          border-radius: 50%;
          background: #ffffff;
          box-shadow: 0 4px 10px rgba(0,0,0,0.10), inset 0 0 0 3px rgba(43,43,43,0.08);
          display: flex;
          align-items: center;
          justify-content: center;
          animation: breathe 1.8s ease-in-out infinite;
        }
        .plate img {
          width: 60%;
          height: 60%;
          object-fit: contain;
          animation: wobble 1.8s ease-in-out infinite;
        }

        .steam {
          position: absolute;
          top: -6px;
          width: 5px;
          border-radius: 3px;
          background: var(--green);
          opacity: 0.7;
          animation: steamRise 1.6s ease-in-out infinite;
        }
        .steam.s1 { left: 44px; height: 14px; animation-delay: 0s; }
        .steam.s2 { left: 74px; height: 18px; animation-delay: 0.25s; }
        .steam.s3 { left: 104px; height: 14px; animation-delay: 0.5s; }

        .label {
          font-family: 'Baloo 2', sans-serif;
          font-weight: 700;
          font-size: 17px;
          color: var(--ink);
          display: flex;
          align-items: baseline;
          gap: 2px;
        }
        .dots span {
          animation: blink 1.4s infinite;
          opacity: 0;
        }
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        .sub {
          font-size: 13px;
          color: var(--ink);
          opacity: 0.55;
          font-weight: 600;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes breathe {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.06); }
        }
        @keyframes wobble {
          0%, 100% { transform: rotate(-4deg); }
          50% { transform: rotate(4deg); }
        }
        @keyframes steamRise {
          0%   { opacity: 0; transform: translateY(4px) scaleY(0.6); }
          35%  { opacity: 0.7; }
          100% { opacity: 0; transform: translateY(-16px) scaleY(1.1); }
        }
        @keyframes blink {
          0%, 20% { opacity: 0; transform: translateY(0); }
          50% { opacity: 1; transform: translateY(-2px); }
          80%, 100% { opacity: 0; transform: translateY(0); }
        }
    </style>
</head>
